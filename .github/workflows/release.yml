name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pytest
        run: pip install pytest

      - name: Run tests
        run: pytest tests/ -v

  release:
    name: Create release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Verify plugin.json version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PLUGIN_VERSION=$(python3 -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          if [ "$TAG_VERSION" != "$PLUGIN_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match plugin.json version $PLUGIN_VERSION — bump plugin.json before tagging."
            exit 1
          fi
          echo "Version check passed: plugin.json ($PLUGIN_VERSION) matches tag (v$TAG_VERSION)"

      - name: Check if pre-release
        id: prerelease
        run: |
          if [[ "${{ steps.version.outputs.VERSION }}" =~ -(alpha|beta|rc) ]]; then
            echo "IS_PRERELEASE=true" >> "$GITHUB_OUTPUT"
          else
            echo "IS_PRERELEASE=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build plugin zip (no wrapper directory)
        run: |
          zip -r claude-status.zip . \
            --exclude "*.git*" \
            --exclude ".pytest_cache/*" \
            --exclude "__pycache__/*" \
            --exclude "tests/__pycache__/*" \
            --exclude ".venv/*"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.VERSION }}
          prerelease: ${{ steps.prerelease.outputs.IS_PRERELEASE }}
          generate_release_notes: true
          files: |
            claude_status.py
            claude-status.zip
